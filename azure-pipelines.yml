trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

pool:
  vmImage: windows-latest

variables:
  buildConfiguration: Release
  dotnetVersion: 10.0.x
  apiProject: RoyalVilla_API/RoyalVilla_API.csproj
  webProject: RoyalVillaWeb/RoyalVillaWeb.csproj
  azureServiceConnection: RoyalVilla-Azure
  apiAppName: royalvilla-api-dev
  webAppName: royalvilla-web-dev

stages:
  - stage: Build
    displayName: Build and Publish
    jobs:
      - job: Build
        displayName: Build API and Web
        steps:
          - task: UseDotNet@2
            displayName: Use .NET SDK $(dotnetVersion)
            inputs:
              packageType: sdk
              version: $(dotnetVersion)

          - task: DotNetCoreCLI@2
            displayName: Restore API
            inputs:
              command: restore
              projects: $(apiProject)

          - task: DotNetCoreCLI@2
            displayName: Restore Web
            inputs:
              command: restore
              projects: $(webProject)

          - task: DotNetCoreCLI@2
            displayName: Build API
            inputs:
              command: build
              projects: $(apiProject)
              arguments: --configuration $(buildConfiguration) --no-restore

          - task: DotNetCoreCLI@2
            displayName: Build Web
            inputs:
              command: build
              projects: $(webProject)
              arguments: --configuration $(buildConfiguration) --no-restore

          - task: DotNetCoreCLI@2
            displayName: Publish API
            inputs:
              command: publish
              publishWebProjects: false
              projects: $(apiProject)
              arguments: --configuration $(buildConfiguration) --no-restore --output $(Build.ArtifactStagingDirectory)/api
              zipAfterPublish: false

          - task: DotNetCoreCLI@2
            displayName: Publish Web
            inputs:
              command: publish
              publishWebProjects: false
              projects: $(webProject)
              arguments: --configuration $(buildConfiguration) --no-restore --output $(Build.ArtifactStagingDirectory)/web
              zipAfterPublish: false

          - task: PublishPipelineArtifact@1
            displayName: Publish API Artifact
            inputs:
              targetPath: $(Build.ArtifactStagingDirectory)/api
              artifact: api-drop

          - task: PublishPipelineArtifact@1
            displayName: Publish Web Artifact
            inputs:
              targetPath: $(Build.ArtifactStagingDirectory)/web
              artifact: web-drop

  - stage: Deploy
    displayName: Deploy to Azure App Service
    dependsOn: Build
    condition: succeeded()
    jobs:
      - job: DeployAPI
        displayName: Deploy API
        steps:
          - download: current
            artifact: api-drop

          - task: AzureWebApp@1
            displayName: Deploy API to App Service
            inputs:
              azureSubscription: $(azureServiceConnection)
              appType: webApp
              appName: $(apiAppName)
              package: $(Pipeline.Workspace)/api-drop

      - job: DeployWeb
        displayName: Deploy Web
        steps:
          - download: current
            artifact: web-drop

          - task: AzureWebApp@1
            displayName: Deploy Web to App Service
            inputs:
              azureSubscription: $(azureServiceConnection)
              appType: webApp
              appName: $(webAppName)
              package: $(Pipeline.Workspace)/web-drop
